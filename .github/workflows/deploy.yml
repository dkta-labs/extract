name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Request pinned infra deployment
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INFRA_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/dkta-labs/infra/dispatches \
            -d '{"event_type":"service-released","client_payload":{"service":"extract","ref":"${{ github.sha }}"}}'
