name: Publish OCI image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Test revision
        run: npm ci && npm test

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/dkta-labs/extract:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test image before publication
        env:
          IMAGE: ghcr.io/dkta-labs/extract:sha-${{ github.sha }}
        run: |
          node --input-type=module -e '
            import { createServer } from "node:http";
            createServer((request, response) => {
              response.setHeader("Content-Type", "application/json");
              if (request.url === "/supported") {
                response.end(JSON.stringify({
                  kinds: [{ x402Version: 2, scheme: "exact", network: "eip155:8453" }],
                  extensions: ["bazaar"],
                  signers: {}
                }));
                return;
              }
              response.statusCode = 404;
              response.end(JSON.stringify({ error: "not found" }));
            }).listen(17402, "0.0.0.0");
          ' &
          facilitator_pid=$!
          cleanup() {
            docker rm --force extract-oci >/dev/null 2>&1 || true
            kill "$facilitator_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 --silent http://127.0.0.1:17402/supported >/dev/null
          docker run --detach --name extract-oci --publish 127.0.0.1:3721:3721 \
            --add-host host.docker.internal:host-gateway \
            --env PAYMENT_ADDRESS=0x0000000000000000000000000000000000000001 \
            --env FACILITATOR_URL=http://host.docker.internal:17402 "$IMAGE"
          test "$(docker inspect --format '{{.Config.User}}' extract-oci)" = node
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3721/health; then
              sleep 1
              test "$(docker inspect --format '{{.State.Running}}' extract-oci)" = true
              exit 0
            fi
            sleep 1
          done
          docker logs extract-oci
          exit 1

      - name: Publish verified image
        id: push
        env:
          IMAGE: ghcr.io/dkta-labs/extract:sha-${{ github.sha }}
        run: |
          output=$(docker push "$IMAGE")
          echo "$output"
          digest=$(echo "$output" | sed -n 's/^.*digest: \(sha256:[0-9a-f]\{64\}\).*$/\1/p' | tail -n 1)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record immutable digest
        run: echo "ghcr.io/dkta-labs/extract@${{ steps.push.outputs.digest }}"
