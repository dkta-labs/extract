name: Publish OCI image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghcr.io/dkta-labs/extract:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test image before publication
        env:
          IMAGE: ghcr.io/dkta-labs/extract:sha-${{ github.sha }}
        run: |
          docker run --detach --name extract-oci --publish 127.0.0.1:3721:3721 "$IMAGE"
          trap 'docker rm --force extract-oci' EXIT
          test "$(docker inspect --format '{{.Config.User}}' extract-oci)" = node
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3721/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs extract-oci
          exit 1

      - name: Publish verified image
        run: docker push "ghcr.io/dkta-labs/extract:sha-${{ github.sha }}"

      - name: Record immutable digest
        run: echo "ghcr.io/dkta-labs/extract@${{ steps.build.outputs.digest }}"
